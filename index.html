<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<title>Manish Kumar Rakesh Kumar Jewellers – Catalog</title>
<meta name="description" content="Sone ke gehnon ke naye designs ek hi jagah. Design pasand karein aur seedhe WhatsApp par bhaav poochhein.">
<style id="css">:root{
  --bg:#F4F4EF; --surface:#FFFFFF; --ink:#15302D; --muted:#5E6E6A; --line:#DCE0D8;
  --green:#0E4A43; --green-2:#0A3832; --gold:#9A6F1C; --gold-soft:#F0E4C3; --ivory:#F7F2E4;
  --gold-metal:#C99A2E; --silver-metal:#8C97A3; --danger:#B3261E; --ok:#1C7A4B; --shadow:0 6px 24px rgba(14,48,44,.10);
  --display:'Marcellus','Times New Roman',serif;
  --body:'Hind','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1918; --surface:#142524; --ink:#EAF0EC; --muted:#9DB0AB; --line:#243836;
    --green:#0B3A34; --green-2:#082B27; --gold:#D9AE55; --gold-soft:#3F3316; --gold-metal:#E0B650; --silver-metal:#B4BEC9; --danger:#F2B8B5; --ok:#6FD39E; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1918; --surface:#142524; --ink:#EAF0EC; --muted:#9DB0AB; --line:#243836;
  --green:#0B3A34; --green-2:#082B27; --gold:#D9AE55; --gold-soft:#3F3316; --gold-metal:#E0B650; --silver-metal:#B4BEC9; --danger:#F2B8B5; --ok:#6FD39E; --shadow:0 6px 24px rgba(0,0,0,.35);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold-metal);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--display);font-weight:400}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:1.5px solid var(--gold-metal);background:transparent;color:var(--ivory);font:600 16px var(--body);text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn.solid{background:var(--gold-metal);color:#1B2A22;border-color:var(--gold-metal)}
.btn.dark{background:var(--green);color:var(--ivory);border-color:var(--green)}
.btn.wa{background:#1F9D55;border-color:#1F9D55;color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.warn{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}html{scroll-behavior:auto}}

/* Top header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--green-2);color:var(--ivory);border-bottom:1px solid rgba(255,255,255,.08)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;margin-right:auto}
.brand b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.logo,.mono{flex:0 0 auto;width:40px;height:40px;border-radius:50%}
.logo{object-fit:cover;background:#fff;border:1.5px solid var(--gold-metal)}
.mono{display:grid;place-items:center;border:1.5px solid var(--gold-metal);color:var(--gold-metal);font-family:var(--display);font-size:16px;letter-spacing:.04em}
.nav{display:none;gap:22px;font-size:15px}
.nav a{text-decoration:none;color:#DCE6DF}.nav a:hover{color:var(--gold-metal)}
@media (min-width:760px){.nav{display:flex}}

/* Hero */
.hero{background:var(--green);color:var(--ivory);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 300px at 85% -10%,rgba(201,154,46,.28),transparent 70%),radial-gradient(400px 260px at -5% 110%,rgba(201,154,46,.14),transparent 70%);pointer-events:none}
.hero .wrap{position:relative;display:grid;gap:32px;padding-top:44px;padding-bottom:44px}
@media (min-width:860px){.hero .wrap{grid-template-columns:1.15fr .85fr;align-items:center;padding-top:72px;padding-bottom:72px}}
.eyebrow{display:inline-block;color:var(--gold-metal);letter-spacing:.16em;text-transform:uppercase;font-size:13px;font-weight:600;margin:0 0 14px}
.hero h1{font-size:clamp(32px,7vw,56px);line-height:1.08;margin:0 0 10px}
.hero .hi{font-size:clamp(17px,3.6vw,24px);color:var(--gold-metal);margin:0 0 16px;font-weight:500}
.hero .lead{max-width:46ch;margin:0 0 26px;color:#DCE6DF;font-size:17px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.stats{display:flex;gap:26px;margin-top:30px;flex-wrap:wrap}
.stats div{min-width:84px}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:1;color:var(--gold-metal)}
.stats span{font-size:13px;color:#C5D4CC}
.collage{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:440px;width:100%;justify-self:center}
.collage .ph{border-radius:16px;overflow:hidden;border:1.5px solid rgba(201,154,46,.6);background:rgba(255,255,255,.06);aspect-ratio:4/5}
.collage.c1{grid-template-columns:1fr;max-width:320px}
.collage.c3 .ph:first-child{grid-row:span 2;aspect-ratio:auto}
.collage img{width:100%;height:100%;object-fit:cover;display:block}
.orn{justify-self:center;width:min(280px,70%);opacity:.95}
.orn svg{width:100%;height:auto;display:block}
.orn .s{stroke:var(--gold-metal);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* Sections */
section.blk{padding:44px 0 8px}
.head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
.head h2{margin:0;font-size:clamp(24px,4.5vw,32px)}
.head p{margin:0;color:var(--muted);font-size:15px}
.tiles{display:flex;gap:12px;overflow-x:auto;padding:2px 20px 10px;margin:0 -20px;scrollbar-width:none;scroll-snap-type:x proximity}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:0 0 132px;scroll-snap-align:start;border:1px solid var(--line);background:var(--surface);border-radius:16px;overflow:hidden;padding:0;cursor:pointer;color:inherit;font:inherit;text-align:center}
.tile .t-art{height:110px;display:grid;place-items:center;background:linear-gradient(160deg,var(--gold-soft),transparent 75%),var(--surface);overflow:hidden}
.tile .t-art svg{width:56%;height:56%}
.tile .t-art img{width:100%;height:100%;object-fit:cover}
.tile span{display:block;padding:8px 6px 2px;font-weight:600;font-size:15px}
.tile em{display:block;padding:0 6px 10px;font-style:normal;color:var(--muted);font-size:13px}

/* Filters */
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:10;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-top:10px}
.search,.inp{width:100%;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:400 16px var(--body)}
textarea.inp{padding:10px 14px;min-height:88px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 20px 2px;margin:0 -20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--green);color:var(--ivory);border-color:var(--green)}
.opts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:14px 0 4px}
.opts select{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px;font:500 15px var(--body)}
.chk{display:flex;gap:8px;align-items:center;font-size:15px}
.chk input{width:18px;height:18px;accent-color:var(--green)}
.count{margin:0 0 0 auto;color:var(--muted);font-size:15px}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:10px 0 48px}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;padding:0;color:inherit;font:inherit;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
.art{position:relative;aspect-ratio:4/5;display:grid;place-items:center;background:linear-gradient(160deg,var(--gold-soft),transparent 75%),var(--surface);overflow:hidden}
.art svg{width:60%;height:60%}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;right:8px;top:8px;background:var(--green);color:var(--ivory);font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--gold-metal)}
.tag{position:absolute;left:0;right:0;bottom:0;background:rgba(10,22,20,.78);color:#fff;font-size:13px;font-weight:500;padding:5px 10px;text-align:center}
.card .info{padding:12px 14px 14px;border-top:1px solid var(--line)}
.card h3{font-size:18px;line-height:1.25;margin:0 0 3px}
.card .meta{margin:0;color:var(--muted);font-size:14px}
.empty{grid-column:1/-1;padding:48px 0;text-align:center;color:var(--muted)}

.gold{--metal:var(--gold-metal)} .silver{--metal:var(--silver-metal)}
svg .s{stroke:var(--metal);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
svg .f{fill:var(--metal);stroke:none}
svg .g{stroke:#2A2320;fill:none;stroke-width:5;stroke-linecap:round}

/* About & contact */
.about{display:grid;gap:10px;padding-bottom:44px}
.about p{margin:0;max-width:62ch;color:var(--muted);font-size:17px}
footer{background:var(--green-2);color:var(--ivory);padding:40px 0 34px}
footer .cols{display:grid;gap:26px}
@media (min-width:760px){footer .cols{grid-template-columns:1.2fr 1fr}}
footer h2{font-size:26px;margin:0 0 10px}
footer p{margin:0 0 6px;color:#DCE6DF}
footer .small{font-size:13px;color:#9FB3AB;margin-top:26px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.1);padding-top:16px}
footer .small a{color:#9FB3AB}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:56px;height:56px;border-radius:50%;background:#1F9D55;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.fab svg{width:30px;height:30px;fill:#fff}

/* Modal */
dialog{border:none;padding:0;border-radius:20px;max-width:480px;width:calc(100% - 28px);max-height:calc(100% - 28px);background:var(--surface);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(8,20,18,.65)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}}
.m-art{position:relative;aspect-ratio:1/1;max-height:52vh;width:100%;display:grid;place-items:center;background:linear-gradient(160deg,var(--gold-soft),transparent 75%),var(--surface);overflow:hidden}
.m-art svg{height:62%}
.m-art img{width:100%;height:100%;object-fit:contain;background:var(--surface)}
.m-body{padding:18px 20px 22px}
.m-body h2{font-size:26px;margin:0 0 4px}
.m-cat{margin:0 0 14px;color:var(--muted);font-size:15px}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin:0 0 14px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
dt{color:var(--muted)} dd{margin:0;font-weight:500}
.m-desc{margin:0 0 14px}
.m-note{margin:0 0 16px;color:var(--muted);font-size:14px}
.m-actions{display:flex;gap:10px;flex-wrap:wrap}
.m-actions .btn{flex:1 1 150px}
.close{position:absolute;top:10px;right:10px;z-index:2;width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.92);color:#15302D;font-size:24px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}

/* Admin */
.abar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--green-2);color:var(--ivory);padding:10px 0}
.arow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.arow strong{font-family:var(--display);font-weight:400;font-size:20px;margin-right:auto}
.arow .btn{border-color:var(--gold-metal)}
.st{flex-basis:100%;font-size:14px;color:#DCE6DF;min-height:20px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1}
.kpi span{color:var(--muted);font-size:13px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}
.sec h2{font-size:22px;margin:0 0 4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.form{display:grid;gap:12px}
@media (min-width:640px){.form.two{grid-template-columns:1fr 1fr}}
.fld{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.fld .inp{color:var(--ink)}
.sub{margin:0;color:var(--muted);font-size:14px}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item .th{width:64px;height:64px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:var(--gold-soft)}
.item .th svg{width:66%;height:66%} .item .th img{width:100%;height:100%;object-fit:cover}
.item h3{margin:0;font-family:var(--body);font-size:16px;font-weight:600}
.item .sub{margin:0}
.item .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.nophoto{color:var(--danger)}
.photo-prev{width:100%;aspect-ratio:16/10;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:14px}
.photo-prev img{width:100%;height:100%;object-fit:contain}
.logo-prev{width:72px;height:72px}
.msg{margin:10px 0 0;font-size:14px;color:var(--ok)}
.pnote{color:var(--muted);font-size:14px;padding-bottom:40px}
.crow{display:flex;gap:8px;margin-bottom:8px}.crow .inp{flex:1}

/* ===== 3D layer ===== */
body{background:radial-gradient(900px 500px at 8% -4%,rgba(201,154,46,.12),transparent 60%),var(--bg)}
.top{background:linear-gradient(180deg,#0D453F,#082B27);box-shadow:0 8px 22px rgba(0,0,0,.28);border-bottom:1px solid rgba(201,154,46,.5)}
.btn{--edge:rgba(0,0,0,.28);box-shadow:0 3px 0 var(--edge),0 8px 14px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--edge),0 12px 18px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.28)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.solid{--edge:#7A5610;background:linear-gradient(180deg,#F2D078,#C99A2E 58%,#AB7E20);border-color:#8E6716;color:#2A1D05;text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:0 4px 0 var(--edge),0 10px 16px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.65)}
.btn.solid:hover{box-shadow:0 6px 0 var(--edge),0 14px 20px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.65)}
.btn.solid:active{box-shadow:0 1px 0 var(--edge),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.dark{--edge:#062521;background:linear-gradient(180deg,#16665D,#0E4A43);border-color:#0A3832}
.btn.wa{--edge:#0F5A2E;background:linear-gradient(180deg,#2FC673,#1F9D55);border-color:#15773F}
.btn.ghost,.btn.warn{--edge:var(--line);box-shadow:0 2px 0 var(--edge)}
.btn.sm{box-shadow:0 2px 0 var(--edge),0 5px 9px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.ghost:hover,.btn.warn:hover{box-shadow:0 3px 0 var(--edge)}
.btn:disabled{box-shadow:none;transform:none}
.stats div{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(201,154,46,.35);border-radius:14px;padding:10px 14px;box-shadow:0 12px 22px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.22)}
.tile{box-shadow:0 2px 0 var(--line),0 10px 18px rgba(14,48,44,.08);transition:transform .2s,box-shadow .2s}
.tile:hover{transform:translateY(-5px);box-shadow:0 2px 0 var(--line),0 18px 28px rgba(14,48,44,.18)}
.chip{box-shadow:0 2px 0 var(--line)}
.chip[aria-pressed="true"]{box-shadow:0 2px 0 #062521,inset 0 1px 0 rgba(255,255,255,.2)}
.grid{perspective:1400px}
.card{position:relative;border-bottom:4px solid var(--gold-soft);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,box-shadow .2s;box-shadow:0 1px 0 var(--line),0 14px 24px -10px rgba(14,48,44,.3),0 2px 5px rgba(14,48,44,.08);will-change:transform}
.card:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px) scale(1.02);box-shadow:0 1px 0 var(--line),0 26px 36px -12px rgba(14,48,44,.4),0 4px 8px rgba(14,48,44,.1)}
.card:active{transform:perspective(900px) scale(.98)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--mx,50%) var(--my,25%),rgba(255,255,255,.3),transparent 55%);opacity:0;transition:opacity .2s;pointer-events:none}
.card:hover::after{opacity:1}
.art::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.22),transparent 42%);pointer-events:none;z-index:1}
.art::after,.m-art::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(201,154,46,.35),inset 0 -50px 40px -40px rgba(0,0,0,.22);pointer-events:none}
.badge,.tag{z-index:2}
.sec,.kpi{box-shadow:0 2px 0 var(--line),0 12px 22px rgba(14,48,44,.06)}
dialog{perspective:900px}
dialog[open]{animation:pop3d .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pop3d{from{opacity:0;transform:perspective(900px) rotateX(-14deg) translateY(26px) scale(.95)}to{opacity:1;transform:none}}
.collage{transform:perspective(1100px) rotateY(-12deg) rotateX(5deg);transform-style:preserve-3d;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:perspective(1100px) rotateY(-8deg) rotateX(3deg) translateY(-10px)}}
.collage .ph{box-shadow:0 24px 38px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.08)}
.collage .ph:nth-child(2){transform:translateZ(30px)}
.collage .ph:nth-child(3){transform:translateZ(60px)}
@media (prefers-reduced-motion:reduce){.collage{animation:none}.card,.tile,.btn{transition:none}.card:hover,.tile:hover{transform:none}dialog[open]{animation:none}}
</style>

function shrink(file,max,type){
 max=max||640;type=type||'image/jpeg';
 return new Promise(function(res,rej){
  var r=new FileReader();
  r.onerror=rej;
  r.onload=function(){
   var im=new Image();
   im.onerror=rej;
   im.onload=function(){
    var k=Math.min(1,max/Math.max(im.width,im.height));
    var c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    var x=c.getContext('2d');
    if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
    x.drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL(type,0.74));
   };
   im.src=r.result;
  };
  r.readAsDataURL(file);
 });
}

/* ---------- Google Sheet (CSV) import ---------- */
function parseCSV(t){
 var rows=[],r=[],f='',q=false,i,c;
 for(i=0;i<t.length;i++){
  c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;
  else if(c===','){r.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}
  else f+=c;
 }
 if(f!==''||r.length){r.push(f);rows.push(r)}
 return rows;
}
function importCSV(text){
 var rows=parseCSV(text);if(rows.length<2)return 'CSV mein data nahi mila.';
 var key=function(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')};
 var idx={};rows[0].forEach(function(h,i){idx[key(h)]=i});
 var col=function(r,k){return idx[k]==null?'':String(r[idx[k]]||'').trim()};
 if(idx.sno==null)return 'Pehla column "S. No." hona chahiye.';
 var added=0,updated=0;
 rows.slice(1).forEach(function(r){
  var code=col(r,'sno');if(!code)return;
  var pur=col(r,'purity').toUpperCase();
  var f={gw:col(r,'gw'),nw:col(r,'nw'),p:pur,stock:parseInt(col(r,'stock'),10)||0,size:col(r,'size')};
  var ex=S.products.filter(function(p){return p.code===code})[0];
  if(ex){Object.assign(ex,f);updated++}
  else{
   var cat=col(r,'category');
   S.products.push(Object.assign({id:'p'+Date.now()+'_'+added,n:code,code:code,c:S.cats.indexOf(cat)>-1?cat:'Other',m:/925|silver/i.test(pur+col(r,'metal'))?'silver':'gold',d:'',img:''},f));
   added++;
  }
 });
 touch();list();
 return added+' naye design jude, '+updated+' update hue.';
}

function publish(){

 });
}
